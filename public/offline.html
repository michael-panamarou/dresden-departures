<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Dresden Departures</title>
    <style>
      :root { color-scheme: light dark; --page: #e8ecf0; --ink: #18212c; --muted: #566273; --action: #1d4f86; }
      @media (prefers-color-scheme: dark) { :root { --page: #111b26; --ink: #e6ebf1; --muted: #9aa7b6; --action: #8cbcf2; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
        font: 1.0625rem/1.5 ui-sans-serif, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 30rem; }
      h1 { font-size: 2rem; line-height: 1.1; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1.25rem; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 0.6rem 1rem; background: var(--action); color: var(--page); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#f7c600" stroke="#00794a" stroke-width="2"/><path d="M10.5 8.5h3v6h5v-6h3v15h-3v-6.2h-5v6.2h-3z" fill="#00794a"/></svg>
      <h1>You're offline</h1>
      <p>Live departures need an internet connection. Check your connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
